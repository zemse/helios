[package]
name = "zemse-helios-linea"
version.workspace = true
edition = "2021"

[dependencies]
# config
figment = { version = "0.10.7", features = ["toml", "env"] }

# async/futures
tokio.workspace = true

# io
serde.workspace = true

#misc
alloy.workspace = true
async-trait.workspace = true
eyre.workspace = true
tracing.workspace = true
strum = { version = "0.26.2", features = ["derive"] }
url = "2.5.0"
reqwest = "0.12"

helios-common = { package = "zemse-helios-common", path = "../common", version = "0.9.0" }
helios-core = { package = "zemse-helios-core", path = "../core", version = "0.9.0" }
helios-ethereum = { package = "zemse-helios-ethereum", path = "../ethereum", version = "0.9.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.37"
