[package]
name = "zemse-helios-ts"
version.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.33"
wasm-bindgen-test = "0.3.0"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

eyre.workspace = true
alloy.workspace = true
op-alloy-rpc-types.workspace = true

hex = "0.4.3"
serde = { version = "1.0.143", features = ["derive"] }
serde_json = "1.0.85"
url = "2.5.0"

# self crates
helios-common = { package = "zemse-helios-common", path = "../common", version = "0.9.0" }
helios-ethereum = { package = "zemse-helios-ethereum", path = "../ethereum", version = "0.9.0" }
helios-opstack = { package = "zemse-helios-opstack", path = "../opstack", version = "0.9.0" }
helios-linea = { package = "zemse-helios-linea", path = "../linea", version = "0.9.0" }

[dependencies.web-sys]
version = "0.3"
features = ["console", "Storage", "Window"]
